name: Build and Release

on:
  push:
    branches: [ "main", "master", "testing" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" , "testing" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set Safe Version Environment Variable
      shell: bash
      # This converts "9/merge" to "9-merge" to prevent file path and artifact upload crashes during PRs
      run: |
        RAW_VERSION="${{ github.ref_name == 'main' && 'dev' || github.ref_name }}"
        SAFE_VERSION="${RAW_VERSION//\//-}"
        echo "SAFE_VERSION=$SAFE_VERSION" >> $GITHUB_ENV

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.3' # Lock this to a stable version to prevent random breaks
        host: ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
        target: 'desktop'

    - name: Install Linux Dependencies
      if: matrix.os == 'ubuntu-latest'
      # Ubuntu 22.04+ removed libfuse2 by default, which breaks AppImage creation. We force-install it here.
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1-mesa-dev libfuse2 libxcb-cursor0

    - name: Configure CMake
      run: >
        cmake -B build 
        -DCMAKE_BUILD_TYPE=Release 
        -DAPP_VERSION="${{ env.SAFE_VERSION }}"

    - name: Build
      run: cmake --build build --config Release

    - name: Package (Linux AppImage)
      if: matrix.os == 'ubuntu-latest'
      run: |
        # Download deployment tools
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy*.AppImage

        # Initialize AppDir
        mkdir -p AppDir/usr/bin
        cp build/GciGui AppDir/usr/bin/

        # Create the desktop file and icon (required by linuxdeploy)
        echo "[Desktop Entry]
        Type=Application
        Name=GCI Calculator
        Exec=GciGui
        Icon=GciGui
        Categories=Science;Math;Engineering;" > AppDir/GciGui.desktop
        touch AppDir/GciGui.svg # Dummy icon so it doesn't crash

        # Run linuxdeploy to bundle Qt and generate the final AppImage
        export QMAKE=$(which qmake)
        export LINUXDEPLOY_OUTPUT_VERSION="${{ env.SAFE_VERSION }}"
        ./linuxdeploy-x86_64.AppImage --appdir AppDir -d AppDir/GciGui.desktop -i AppDir/GciGui.svg --plugin qt --output appimage
        
        # Rename output for cleaner artifacts
        mv GCI_Calculator*.AppImage GciGui-${{ env.SAFE_VERSION }}-x86_64.AppImage

    - name: Package (Windows Portable EXE)
      if: matrix.os == 'windows-latest'
      run: |
        # 1. Gather all required Qt DLLs into the Release folder
        windeployqt build/Release/GciGui.exe
        
        # 2. Download the Warp packer
        Invoke-WebRequest -Uri "https://github.com/dgiagio/warp/releases/download/v0.3.0/windows-x64.warp-packer.exe" -OutFile "warp-packer.exe"
        
        # 3. Pack the folder into a single executable
        .\warp-packer.exe --arch windows-x64 --input_dir build/Release --exec GciGui.exe --output GciGui-${{ env.SAFE_VERSION }}-Windows.exe

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GciGui-${{ env.SAFE_VERSION }}-${{ matrix.os }}
        path: |
          GciGui-*.AppImage
          GciGui-*-Windows.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Safe Version Environment Variable
        shell: bash
        run: |
          RAW_VERSION="${{ github.ref_name == 'main' && 'dev' || github.ref_name }}"
          SAFE_VERSION="${RAW_VERSION//\//-}"
          echo "SAFE_VERSION=$SAFE_VERSION" >> $GITHUB_ENV
      
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          host: 'mac'
          target: 'desktop'

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build

      - name: Package for Mac
        run: |
          macdeployqt build/GciGui.app
          zip -r GciGui-${{ env.SAFE_VERSION }}-macOS.zip build/GciGui.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GciGui-${{ env.SAFE_VERSION }}-macos-latest
          path: GciGui-*-macOS.zip

  release:
    name: Create Release
    needs: [build, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/GciGui-*.AppImage
            artifacts/GciGui-*.exe
            artifacts/GciGui-*-macOS.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}