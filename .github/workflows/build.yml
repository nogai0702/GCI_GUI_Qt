name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.5.*'
        host: ${{ matrix.os == 'ubuntu-latest' && 'linux' || 'windows' }}
        target: 'desktop'
        arch: ${{ matrix.os == 'ubuntu-latest' && 'gcc_64' || 'win64_msvc2019_64' }}

    - name: Install Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgl1-mesa-dev libxcb-cursor0 imagemagick

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DAPP_VERSION="${{ github.ref_name }}"

    - name: Build
      run: cmake --build build --config Release

    - name: Package (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        windeployqt build/Release/GciGui.exe
        powershell Compress-Archive -Path build/Release/* -DestinationPath GciGui-${env:GITHUB_REF_NAME}-Windows.zip

    - name: Package (Linux AppImage)
      if: matrix.os == 'ubuntu-latest'
      run: |
        # Install linuxdeploy and the Qt plugin
        wget -c https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget -c https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy*.AppImage

        # Create a basic .desktop file and icon for linuxdeploy to use
        mkdir -p deploy
        cat > deploy/GciGui.desktop <<EOF
        [Desktop Entry]
        Type=Application
        Name=GCI Calculator
        Exec=GciGui
        Icon=gcigui
        Categories=Science;
        EOF
        convert -size 256x256 xc:transparent deploy/gcigui.png

        # Run linuxdeploy
        export QMAKE=$(which qmake6 || which qmake)

        ./linuxdeploy-x86_64.AppImage --appdir AppDir --executable build/GciGui --desktop-file deploy/GciGui.desktop -i deploy/gcigui.png --plugin qt --output appimage

        # Move the resulting AppImage to the root for upload
        mv GCI_Calculator-x86_64.AppImage GciGui-${GITHUB_REF_NAME}-x86_64.AppImage

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GciGui-${{ github.ref_name }}-${{ matrix.os }}
        path: |
          GciGui-*.AppImage
          GciGui-*.zip

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            **/GciGui-*.AppImage
            **/GciGui-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
